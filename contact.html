
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; }
  .scene {
    width: 100%;
    min-height: 100vh;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-sans);
    overflow: hidden;
    position: relative;
  }
  .orbit-wrap {
    position: relative;
    width: 520px;
    height: 520px;
  }
  .orbit-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.08);
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 420px;
    height: 420px;
  }
  .orbit-ring-inner {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.05);
  }
  /* center photo */
  .center-node {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    z-index: 20;
    text-align: center;
  }
  .photo-ring {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 3px solid rgba(255,78,149,0.8);
    box-shadow: 0 0 28px rgba(255,78,149,0.45), 0 0 60px rgba(255,78,149,0.15);
    overflow: hidden;
    position: relative;
    animation: photoPulse 3s ease-in-out infinite;
  }
  @keyframes photoPulse {
    0%,100% { box-shadow: 0 0 28px rgba(255,78,149,0.45), 0 0 60px rgba(255,78,149,0.15); }
    50%      { box-shadow: 0 0 40px rgba(255,78,149,0.7), 0 0 80px rgba(255,78,149,0.25); }
  }
  .photo-ring img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .center-ping {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: 1px solid rgba(255,78,149,0.2);
    animation: ping 2.5s ease-out infinite;
    pointer-events: none;
  }
  .center-ping2 {
    animation-delay: 1.2s;
    width: 190px;
    height: 190px;
  }
  @keyframes ping {
    0%   { transform: translate(-50%,-50%) scale(1); opacity: 0.6; }
    100% { transform: translate(-50%,-50%) scale(1.5); opacity: 0; }
  }
  .name-tag {
    margin-top: 10px;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.04em;
  }
  .title-tag {
    color: rgba(255,255,255,0.45);
    font-size: 11px;
    letter-spacing: 0.08em;
    margin-top: 2px;
  }
  /* orbital nodes */
  .node {
    position: absolute;
    top: 50%; left: 50%;
    transform-origin: 0 0;
    z-index: 10;
  }
  .node-btn {
    position: absolute;
    transform: translate(-50%,-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.25s;
    will-change: transform;
  }
  .node-btn:hover { transform: translate(-50%,-50%) scale(1.18); }
  .node-icon {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  .node-btn:hover .node-icon {
    border-color: rgba(255,255,255,0.6);
    box-shadow: 0 0 16px rgba(255,255,255,0.2);
  }
  .node-label {
    color: rgba(255,255,255,0.6);
    font-size: 10px;
    letter-spacing: 0.07em;
    white-space: nowrap;
    transition: color 0.25s;
  }
  .node-btn:hover .node-label { color: rgba(255,255,255,0.95); }

  /* connector lines */
  .connector {
    position: absolute;
    top: 50%; left: 50%;
    transform-origin: 0 0;
    pointer-events: none;
    opacity: 0.12;
  }

  /* auto-rotate animation */
  @keyframes orbit {
    from { --angle: 0deg; }
    to   { --angle: 360deg; }
  }
</style>

<div class="scene">

</div>

const R = 185; // orbit radius
const cx = 260, cy = 260;
const nodesEl = document.getElementById('nodes');
const linesEl = document.getElementById('lines');
let angle = 0;
let positions = [];

function place(idx) {
  const a = (2 * Math.PI * idx / contacts.length) + angle;
  const x = cx + R * Math.cos(a);
  const y = cy + R * Math.sin(a);
  return { x, y, a };
}

// build nodes
contacts.forEach((c, i) => {
  const div = document.createElement('a');
  div.href = c.href;
  div.target = c.href.startsWith('mailto') ? '_self' : '_blank';
  div.rel = 'noopener';
  div.className = 'node-btn';
  div.style.position = 'absolute';
  div.innerHTML = `<div class="node-icon">${c.icon}</div><span class="node-label">${c.label}</span>`;
  nodesEl.appendChild(div);
});

const nodeEls = Array.from(nodesEl.querySelectorAll('.node-btn'));

// build svg lines
contacts.forEach((c, i) => {
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('stroke', c.color);
  line.setAttribute('stroke-width', '1');
  line.setAttribute('opacity', '0.2');
  linesEl.appendChild(line);
});
const lineEls = Array.from(linesEl.querySelectorAll('line'));

function tick() {
  contacts.forEach((c, i) => {
    const {x, y} = place(i);
    nodeEls[i].style.left = x + 'px';
    nodeEls[i].style.top  = y + 'px';
    lineEls[i].setAttribute('x1', cx);
    lineEls[i].setAttribute('y1', cy);
    lineEls[i].setAttribute('x2', x);
    lineEls[i].setAttribute('y2', y);
  });
  angle += 0.004;
  requestAnimationFrame(tick);
}
tick();

// pause rotation on hover
nodesEl.addEventListener('mouseover', () => { /* keep rotating, just scale node */ });
